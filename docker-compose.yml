services:
  db:
    image: postgres:17-alpine
    container_name: c216-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Healthcheck básico: o container só é considerado saudável quando o
    # PostgreSQL aceita conexões. O `$$` escapa a variável para que ela seja
    # expandida pelo shell do container, e não pelo Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - c216-network

  backend:
    build:
      context: ./backend
    container_name: c216-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8000"
    # Bind mount do código-fonte para que o --reload do Uvicorn funcione
    # sem necessidade de rebuild da imagem a cada alteração.
    volumes:
      - ./backend:/app
    # Só sobe depois que o healthcheck do banco passa.
    depends_on:
      db:
        condition: service_healthy
    # A imagem slim não tem curl, então o healthcheck usa o urllib do Python.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/status', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - c216-network

  frontend:
    build:
      context: ./frontend
    container_name: c216-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    # Bind mount para o HMR do Vite; o volume anônimo preserva o node_modules
    # instalado na imagem (não é sobrescrito pelo diretório local).
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    # Alpine/busybox: usa wget, que já vem na imagem.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - c216-network

volumes:
  postgres_data:

networks:
  c216-network:
    driver: bridge
