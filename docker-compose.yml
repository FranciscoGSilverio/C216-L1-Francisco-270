name: cinema

services:
  db:
    image: postgres:17-alpine
    container_name: cinema-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # O `$$` escapa a variável para ser expandida pelo shell do container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cinema-network

  backend:
    build:
      context: ./backend
    container_name: cinema-backend
    restart: unless-stopped
    environment:
      # Dentro da rede do Compose o host do banco é o nome do serviço.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Banco separado para os testes: não apaga os dados da aplicação.
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8000"
    # Bind mount para o --reload funcionar sem rebuild a cada alteração.
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    # As migrations rodam antes do servidor: subir os contêineres já cria o schema.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # A imagem slim não tem curl, então o healthcheck usa o urllib do Python.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/status', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cinema-network

  frontend:
    build:
      context: ./frontend
    container_name: cinema-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    # Bind mount para o HMR do Vite; o volume anônimo preserva o node_modules
    # instalado na imagem (não é sobrescrito pelo diretório local).
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    # Alpine/busybox: usa wget, que já vem na imagem.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cinema-network

volumes:
  postgres_data:

networks:
  cinema-network:
    driver: bridge
