name: CI - Frontend

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Biome, Vitest, Build e Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Verifica lint e formatação
        run: npm run check

      - name: Executa os testes
        run: npm run test

      - name: Gera o build de produção
        run: npm run build

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Sobe a stack isolada do Compose (db, backend, frontend), roda o
      # Playwright contra ela e derruba tudo ao final.
      - name: Executa os testes E2E pela stack do Compose
        working-directory: .
        run: make e2e

      - name: Envia o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
